name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduplatform
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduplatform
      AUTH_SECRET: 0123456789abcdef0123456789abcdef
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck core
        run: npx tsc -p packages/core/tsconfig.json --noEmit

      - name: Typecheck infrastructure
        run: npx tsc -p packages/infrastructure/tsconfig.json --noEmit

      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Lint web
        run: npm run lint --workspace web

      - name: Build web
        run: npm run build --workspace web
